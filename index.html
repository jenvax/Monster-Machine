<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Inter:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell experiment-shell production-shell">
      <section class="machine-head experiment-head" aria-labelledby="page-title">
        <div class="title-wrap">
          <p class="eyebrow">Jen Vax Creative</p>
          <h1 id="page-title">Monster Machine</h1>
        </div>
        <div class="doodle-strip" aria-hidden="true">
          <span class="doodle moon"></span>
          <span class="doodle pumpkin"></span>
          <span class="doodle ghost"></span>
        </div>
      </section>

      <section class="mode-switcher" aria-label="Monster Machine mode">
        <button
          class="mode-card active"
          type="button"
          data-mode-button="make"
          aria-pressed="true"
        >
          <span>MAKE A MONSTER</span>
          <small>Build an original creature from scratch.</small>
        </button>
        <button
          class="mode-card"
          type="button"
          data-mode-button="mash"
          aria-pressed="false"
        >
          <span>MONSTER MASH</span>
          <small>Combine familiar creatures into something unexpected.</small>
        </button>
      </section>

      <p class="mode-helper" id="modeHelper">
        Build a monster one playful decision at a time.
      </p>

      <section class="experiment-controls production-controls" aria-label="Monster generator controls">
        <button class="primary-button" id="rollButton" type="button">
          ROLL MONSTER
        </button>
        <button class="secondary-button one-monster-button" id="rollOneMonsterButton" type="button">
          ROLL ONE MONSTER
        </button>
        <button class="secondary-button two-monster-button" id="rollTwoMonsterButton" type="button">
          ROLL TWO MONSTERS
        </button>
      </section>

      <section
        class="experiment-deck production-deck"
        id="generatorDeck"
        aria-live="polite"
      ></section>

      <section class="experiment-result section-panel production-result" aria-live="polite">
        <p class="section-kicker">Your monster</p>
        <p class="experiment-prompt" id="drawingPrompt">
          Roll a monster to reveal your creative recipe.
        </p>
      </section>
    </main>

    <script src="./src/make-options.js"></script>
    <script src="./src/experiment-options.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
